<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Fourier Compression</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070a10'/%3E%3Cpath d='M4 20 L8 20 10 12 13 23 16 15 19 24 22 10 25 18 28 18' stroke='%233ec6ff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<div class="wrap">

  <div class="toolbar">
    <div class="curve-toggles">
      <button class="curvetoggle cyan filled" id="tgl-orig" aria-label="Show original line" title="Original line">
        <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16 C8 7 12 7 16 16 C20 25 24 25 29 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
      <button class="curvetoggle green filled" id="tgl-recon" aria-label="Show reconstructed line" title="Reconstructed line">
        <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16 C8 25 12 25 16 16 C20 7 24 7 29 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button class="iconbtn" id="modebtn" aria-label="Toggle smooth or raw points" title="Smooth / raw points">
      <svg class="ic-smooth" viewBox="0 0 32 32" aria-hidden="true"><path d="M2 18 C5 8 8 8 11 18 C14 28 17 28 20 18 C23 8 26 8 30 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <svg class="ic-points" viewBox="0 0 32 32" aria-hidden="true"><circle cx="6" cy="18" r="3.2"/><circle cx="13" cy="9" r="3.2"/><circle cx="20" cy="20" r="3.2"/><circle cx="27" cy="11" r="3.2"/></svg>
    </button>
  </div>

  <main id="panels">
    <section class="card" id="card-signal">
      <header class="card-head">
        <h2>Image Space</h2>
      </header>
      <div class="cvwrap"><canvas id="cv-signal"></canvas></div>
    </section>

    <section class="card" id="card-transform">
      <header class="card-head">
        <h2>Frequency Space</h2>
      </header>
      <div class="cvwrap" id="cvwrap-transform">
        <div class="savepct" id="savepct">100%</div>
        <canvas id="cv-transform"></canvas>
        <div class="vslider" id="vslider" role="slider" tabindex="0" aria-label="Amplitude cutoff" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.12">
          <div class="vs-track"><div class="vs-fill" id="vsFill"></div><div class="vs-thumb" id="vsThumb"></div></div>
        </div>
      </div>
    </section>
  </main>

</div>
<script src="app.js"></script>
</body>
</html>
